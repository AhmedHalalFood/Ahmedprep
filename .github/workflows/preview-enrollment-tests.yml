name: Preview enrollment policy and email safety tests

on:
  pull_request:
    paths:
      - "app/enroll-2027/**"
      - "app/api/enrollment-2027/**"
      - "lib/cohorts-2027.ts"
      - "lib/enrollment-2027-inquiry.ts"
      - "lib/email-sender.ts"
      - "lib/lead-*.ts"
      - "lib/program-retirement.ts"
      - "tests/**"
      - "scripts/verify-preview-db.mjs"
      - ".github/workflows/preview-enrollment-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policies-and-email-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ENV: preview
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run master-plan, pricing, historic cohort and preview email unit tests
        run: >-
          node --experimental-strip-types --import ./tests/alias-loader.mjs --test
          tests/approved-2027-master-plan.test.mjs
          tests/early-deadline-21-day.test.mjs
          tests/enrollment-2027-historical-email-safety.test.mjs
          tests/program-retirement.test.mjs
      - name: Build the application for smoke tests
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build
      - name: Safe Preview page and API smoke tests (no customer submission)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          # Hosted Previews require Vercel authentication. Serve this checkout on loopback.
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3217 > preview-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3217/ > /dev/null; then
              if node tests/preview-http-smoke.mjs --local; then
                exit 0
              fi
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat preview-server.log
          exit 1
